name: Aggiorna ritardi
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla avvio immediato o fascia oraria italiana
        id: fascia
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "esegui=true" >> "$GITHUB_OUTPUT"
            echo "Avvio immediato dopo la modifica del workflow."
          else
            NOW=$(TZ=Europe/Rome date '+%Y-%m-%d %H')
            if [ "$NOW" < "2026-10-18 12" ]; then
              echo "esegui=false" >> "$GITHUB_OUTPUT"
              echo "La programmazione oraria inizierà domani alle 12:00, ora italiana."
            else
              HOUR=$(TZ=Europe/Rome date +%H)
              if [ "$HOUR" -ge 12 ] || [ "$HOUR" -le 1 ]; then
                echo "esegui=true" >> "$GITHUB_OUTPUT"
              else
                echo "esegui=false" >> "$GITHUB_OUTPUT"
                echo "Fuori fascia: sono le ore $HOUR in Italia. Nessun aggiornamento."
              fi
            fi
          fi
      - uses: actions/checkout@v4
        if: steps.fascia.outputs.esegui == 'true'
      - uses: actions/setup-python@v5
        if: steps.fascia.outputs.esegui == 'true'
        with:
          python-version: '3.12'
      - run: python3 gen.py
        if: steps.fascia.outputs.esegui == 'true'
      - name: Salva aggiornamenti
        if: steps.fascia.outputs.esegui == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ritardi_goal.txt ritardi_over.txt prossime_partite.txt prossime_partite_goal.txt prossime_partite_over.txt sottofrequenze.txt tips_del_giorno.txt saltati.txt index.html
          git commit -m "Aggiornamento ritardi $(date -u +%FT%TZ)" || echo "nessuna modifica"
          git push
